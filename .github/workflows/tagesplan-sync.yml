name: Aktuellen Theater-Tagesplan erkennen
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'scripts/sync_dayplan.py'
      - '.github/workflows/tagesplan-sync.yml'
permissions:
  contents: write
concurrency:
  group: theater-dayplan
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'pypdf>=6,<7'
      - run: python scripts/sync_dayplan.py
      - name: Auswahl speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tagesplan-aktuell.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aktuellen Theater-Tagesplan automatisch auswählen'
          git pull --rebase origin main
          git push origin HEAD:main
