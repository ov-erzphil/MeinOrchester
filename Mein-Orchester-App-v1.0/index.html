<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Orchester App – Version 1.0</title><style>html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column}body>#app{margin-top:0!important}#dayplan{display:none;position:absolute;inset:45px 0 0;background:white;z-index:20;flex-direction:column}#dayplan.open{display:flex}#dayplan iframe{flex:1;width:100%;border:0}#dayplan .bar{padding:8px;display:flex;justify-content:space-between;gap:8px;background:#edf2f5;font:14px system-ui}#dayplan .bar a{color:#185b77}iframe{width:100%;min-height:0;flex:1;border:0;display:block}</style></head><body><div id="dayplan" role="region" aria-label="Aktueller Tagesplan"><div class="bar"><strong>Tagesaktueller Theaterplan (PDF)</strong><span><a id="dayplan-external" target="_blank" rel="noopener noreferrer" href="https://www.erzgebirgische.theater/user/aktuell1.pdf">Extern öffnen</a> &nbsp; <button id="refresh-dayplan" type="button">Aktualisieren</button> &nbsp; <button id="close-dayplan" type="button">Schließen</button></span></div><iframe id="dayplan-frame" title="Tagesplan PDF"></iframe></div><section id="mo-login" style="display:none;position:fixed;inset:0;z-index:9999;background:#102d40;color:white;align-items:center;justify-content:center;padding:20px;font:16px system-ui"><form id="mo-login-form" style="width:min(360px,100%);display:grid;gap:14px"><h1 style="margin:0;font-size:25px">Mein Orchester</h1><p style="margin:0">Bitte das gemeinsame Orchester-Passwort eingeben. Die Anmeldung gilt 90 Tage auf diesem Gerät.</p><input id="mo-login-password" type="password" autocomplete="current-password" required placeholder="Orchester-Passwort" style="font:inherit;padding:13px;border-radius:7px;border:1px solid #ccc"><button style="font:inherit;padding:13px;background:#28734c;color:white;border:0;border-radius:7px">App öffnen</button><small id="mo-login-error" role="alert" style="color:#ffbdbd"></small></form></section><iframe id="app" title="Mein Orchester App – Version 1.0" data-src="../index.html?downloads=20261029b"></iframe><script>
(async()=>{
const key='mo_colleagues_auth_v2', lifetime=90*24*60*60*1000;
const expected='66b91cd6ca4ea113ac9c609c37ddeb5ae2aacfdb5133d31c5846a8093593c2ed';
const login=document.getElementById('mo-login'),app=document.getElementById('app');
function launch(){login.style.display='none';app.src=app.dataset.src}
let valid=false;try{const saved=JSON.parse(localStorage.getItem(key)||'null');valid=!!saved&&saved.expires>Date.now()}catch{}
if(valid){launch()}else{login.style.display='flex'}
document.getElementById('mo-login-form').addEventListener('submit',async e=>{
e.preventDefault();
const password=document.getElementById('mo-login-password').value;
const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(password));
const digest=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
if(digest!==expected){document.getElementById('mo-login-error').textContent='Passwort nicht korrekt.';return}
localStorage.setItem(key,JSON.stringify({expires:Date.now()+lifetime}));launch();
});
})();
document.getElementById('app').addEventListener('load',function(){
 try{
 const doc=this.contentDocument;
 if(!doc)return;



 // Notenansicht mit aktuellem Katalog; die bestehende Navigation bleibt unverändert.
 const showLiveNotes=async()=>{
   let panel=document.getElementById('mo-notes-live-panel');
   if(!panel){
     panel=document.createElement('section');panel.id='mo-notes-live-panel';
     panel.style.cssText='position:fixed;inset:0;z-index:2147483001;background:#f8fafc;color:#17324a;overflow:auto;padding:16px;box-sizing:border-box;font:15px system-ui';
     panel.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">Notenarchiv</h2><button id="mo-notes-close" type="button" style="padding:9px">Schließen</button></div><label style="display:block;margin:14px 0">Produktion <select id="mo-notes-production" style="display:block;width:100%;padding:10px;font:inherit"></select></label><label style="display:block;margin:10px 0">Einzelstimme / Instrument <select id="mo-notes-instrument" style="display:block;width:100%;padding:10px;font:inherit"></select></label><label style="display:block;margin:10px 0">Suche nach Instrument oder Stück <input id="mo-notes-query" type="search" placeholder="z. B. Horn, Trompete, Nr. 06" style="display:block;width:100%;padding:10px;box-sizing:border-box;font:inherit"></label><p id="mo-notes-count"></p><div id="mo-notes-results">Lade Noten …</div>';
     document.body.appendChild(panel);
     panel.querySelector('#mo-notes-close').onclick=()=>panel.remove();
   }
   const results=panel.querySelector('#mo-notes-results'),select=panel.querySelector('#mo-notes-production'),instrument=panel.querySelector('#mo-notes-instrument'),query=panel.querySelector('#mo-notes-query');
   results.textContent='Lade Noten …';
   try{
     const res=await fetch(new URL('../noten-katalog.json?t='+Date.now(),location.href),{cache:'no-store'});
     if(!res.ok)throw Error('HTTP '+res.status);
     const data=await res.json(),files=data.files||[];
     const current=select.value;select.replaceChildren();
     for(const name of ['Alle Produktionen',...new Set(files.map(f=>f.production))].sort((a,b)=>a==='Alle Produktionen'?-1:b==='Alle Produktionen'?1:a.localeCompare(b,'de'))){
       const option=document.createElement('option');option.value=name;option.textContent=name;select.appendChild(option);
     }
     select.value=[...select.options].some(o=>o.value===current)?current:(files.some(f=>f.production==='Bunbury')?'Bunbury':'Alle Produktionen');
     const updateInstruments=()=>{
       const current=instrument.value;instrument.replaceChildren();
       const available=[...new Set(files.filter(f=>select.value==='Alle Produktionen'||f.production===select.value).flatMap(f=>f.instruments||[]))].sort((a,b)=>a.localeCompare(b,'de'));
       for(const name of ['Alle Instrumente',...available]){const opt=document.createElement('option');opt.value=name;opt.textContent=name;instrument.appendChild(opt)}
       instrument.value=available.includes(current)?current:(available.includes('Horn')?'Horn':'Alle Instrumente');
     };
     const render=()=>{
       const term=query.value.toLocaleLowerCase('de'),production=select.value,inst=instrument.value;
       const matching=files.filter(f=>(production==='Alle Produktionen'||f.production===production)&&(inst==='Alle Instrumente'||(f.instruments||[]).includes(inst))&&(!term||[f.name,f.work,f.production,...(f.instruments||[])].join(' ').toLocaleLowerCase('de').includes(term)));
       panel.querySelector('#mo-notes-count').textContent=matching.length+' PDF-Dateien';
       results.replaceChildren();
       for(const file of matching.slice(0,600)){
         const link=document.createElement('a');link.href=file.url;link.target='_blank';link.rel='noopener noreferrer';
         link.textContent='📄 '+file.name;link.style.cssText='display:block;padding:10px;margin:5px 0;background:#fff;border:1px solid #dce4eb;border-radius:6px;color:#185b77;text-decoration:none';results.appendChild(link);
       }
     };
     select.onchange=()=>{instrument.value='Alle Instrumente';updateInstruments();render()};instrument.onchange=render;query.oninput=render;updateInstruments();render();
   }catch(err){results.textContent='Notenkatalog konnte nicht geladen werden: '+err.message;}
 };
 const openNotes=event=>{
   const target=event.target.closest?.('button,a,[role=tab]');
   if(!target)return;
   const label=(target.textContent||'').trim();
   if(label==='Noten'||label==='Notenarchiv'){event.preventDefault();event.stopImmediatePropagation();showLiveNotes()}
 };
 doc.addEventListener('click',openNotes,true);
 // Live Google Drive documents: replace the legacy fixed list when Downloads is opened.
 const showLiveDocuments=async()=>{
   let panel=document.getElementById('mo-documents-live-panel');
   if(!panel){
     panel=document.createElement('section');panel.id='mo-documents-live-panel';
     panel.style.cssText='position:fixed;inset:0;z-index:2147483000;background:#f8fafc;color:#17324a;overflow:auto;padding:18px;box-sizing:border-box;font:16px system-ui';
     panel.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0;font-size:22px">Dokumente · Google Drive</h2><button id="mo-documents-close" type="button" style="padding:9px 14px">Schließen</button></div><p style="font-size:13px">Automatisch aus Google Drive synchronisiert (normalerweise alle 30 Minuten).</p><div id="mo-documents-list" role="status">Dokumente werden geladen …</div><p><a target="_blank" rel="noopener noreferrer" href="https://drive.google.com/drive/folders/1N_G-1mRKps4Yv1x7IsrQqKBEYc2pDWpy">Ordner direkt in Google Drive öffnen</a> · <button id="mo-documents-refresh" type="button">Liste aktualisieren</button></p>';
     document.body.appendChild(panel);
     panel.querySelector('#mo-documents-close').onclick=()=>panel.remove();
     panel.querySelector('#mo-documents-refresh').onclick=()=>showLiveDocuments();
   }
   const list=panel.querySelector('#mo-documents-list');list.textContent='Dokumente werden geladen …';
   try{
     const response=await fetch(new URL('../dokumente-katalog.json?t='+Date.now(),location.href),{cache:'no-store'});
     if(!response.ok)throw Error('HTTP '+response.status);
     const data=await response.json();list.replaceChildren();
     if(!Array.isArray(data.files))throw Error('Ungültiger Katalog');
     if(!data.files.length)list.textContent='Der Ordner enthält derzeit keine PDF-Dateien.';
     for(const file of data.files){
       const a=document.createElement('a');a.href=file.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='📄 '+file.name;
       a.style.cssText='display:block;padding:13px;margin:7px 0;background:white;border:1px solid #d8e1e8;border-radius:7px;color:#174d78;text-decoration:none';
       list.appendChild(a);
     }
     const time=document.createElement('small');time.style.cssText='display:block;margin-top:12px;color:#54616d';time.textContent='Letzter Katalogabgleich: '+new Date(data.updatedAt).toLocaleString('de-DE');list.appendChild(time);
   }catch(error){list.textContent='Die Dokumentenliste konnte nicht geladen werden. Bitte den Google-Drive-Ordner über den Link unten öffnen.';}
 };
 const isDownloads=(node)=>{if(!node||node.nodeType!==1||node.closest('#mo-documents-live-panel'))return false;const labels=[node.getAttribute('aria-label'),node.getAttribute('title'),node.innerText,node.textContent].filter(Boolean).map(x=>x.trim());return labels.some(x=>/^(Downloads|Dokumente)$/i.test(x)||/^(Downloads|Dokumente)\s*[▼▾⌄]$/i.test(x))};
 const openDownloads=(event)=>{
   const path=event.composedPath?.()||[];
   let target=path.find(el=>el?.nodeType===1&&isDownloads(el)&&el.id!=='mo-documents-close'&&el.id!=='mo-documents-refresh');
   if(!target){let el=event.target;for(let i=0;el&&i<6;i++,el=el.parentElement){if(isDownloads(el)){target=el;break}}}
   if(!target)return;
   event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();showLiveDocuments();
 };
 doc.addEventListener('click',openDownloads,true);
 doc.addEventListener('pointerup',event=>{if(event.pointerType==='touch')openDownloads(event)},true);
  const placeMenu=()=>{if(doc.getElementById('mo-theater-menu'))return;const candidates=[...doc.querySelectorAll('button,a,[role=tab]')];const anchor=candidates.find(x=>/^Notenarchiv$/i.test((x.textContent||'').trim()))||candidates.find(x=>/^Dienstplan$/i.test((x.textContent||'').trim()));if(!anchor)return;const tab=doc.createElement('button');tab.id='mo-theater-menu';tab.type='button';tab.textContent='Tagesplan';tab.title='Tagesplan Theater (PDF)';tab.setAttribute('aria-label','Tagesplan Theater (PDF)');tab.className=anchor.className;tab.style.cssText='cursor:pointer;white-space:normal;min-width:0';tab.onclick=()=>openDayplan();anchor.insertAdjacentElement('afterend',tab)};const labels={'Dienstplan':'Dienste','Spielstätten':'Orte','Eilmitteilungen':'Aktuell','Notenarchiv':'Noten','Dokumente':'Downloads'};const shorten=()=>{for(const el of doc.querySelectorAll('button,a,[role=tab]')){if(el.id==='mo-theater-menu')continue;const raw=(el.textContent||'').trim();if(labels[raw]){const node=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim()===raw);if(node)node.textContent=labels[raw];else if(el.children.length===0)el.textContent=labels[raw];el.title=raw;el.setAttribute('aria-label',raw)}}};const ensureLiveDocuments=()=>{const extra=doc.getElementById('mo-live-documents');if(extra)extra.remove()};const refresh=()=>{placeMenu();shorten();ensureLiveDocuments();const candidates=[...doc.querySelectorAll('button,a,[role=tab]')];const target=candidates.find(el=>(el.textContent||'').trim()==='Downloads')||candidates.find(el=>(el.getAttribute('aria-label')||'').trim()==='Dokumente');if(target){target.style.cursor='pointer';if(!target.dataset.moDownloadsBound){target.dataset.moDownloadsBound='1';target.addEventListener('click',openDownloads,true)}}const oldProxy=document.getElementById('mo-downloads-click-proxy');if(oldProxy)oldProxy.remove()};refresh();setTimeout(refresh,900);setTimeout(refresh,2500);let pending=false;const observer=new MutationObserver(()=>{if(pending)return;pending=true;queueMicrotask(()=>{pending=false;refresh()})});observer.observe(doc.body,{childList:true,subtree:true});
 if(doc.getElementById('mo-navigation-test'))return;
 const script=doc.createElement('script');
 script.id='mo-navigation-test';script.src=new URL('navigation-test.js?v=1.0',window.location.href).href;
 script.onerror=()=>alert('Navigationstest konnte nicht geladen werden.');
 doc.body.append(script);
 }catch(err){alert('Test konnte nicht geladen werden: '+err.message)}
});
</script><script>const dayplan=document.getElementById("dayplan");function openDayplan(){const url="https://www.erzgebirgische.theater/user/aktuell1.pdf";window.open(url,"_blank","noopener,noreferrer")};document.getElementById("refresh-dayplan").onclick=()=>openDayplan();document.getElementById("close-dayplan").onclick=()=>{dayplan.classList.remove("open");document.getElementById("dayplan-frame").removeAttribute("src")};</script></body></html>
