<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Orchester – Navigationstest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./index.html" title="Mein Orchester Navigationstest"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try {
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('mo-test-navigation-script'))return;
    const script=doc.createElement('script');
    script.id='mo-test-navigation-script';
    script.src='./navigation-test.js?v=2';
    script.onerror=()=>alert('Navigationstest konnte nicht geladen werden.');
    doc.body.append(script);
  }catch(e){alert('Testansicht konnte nicht eingebunden werden: '+e.message)}
});
</script></body></html>
